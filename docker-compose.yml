services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: atmaen
      MYSQL_USER: atmaen
      MYSQL_PASSWORD: atmaen
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://atmaen:atmaen@db:3306/atmaen?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-please-set-a-long-random-secret-in-env}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./backend/models_store:/app/models_store

  admin:
    build: ./admin
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  dbdata:
  uploads:
