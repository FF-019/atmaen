<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE">
<meta name="description" content="اطمئن: دليل الإسعافات الأولية الذكي عند بلع الطفل لمادة كيميائية">
<meta property="og:title" content="اطمئن · Atma'en">
<meta property="og:description" content="ماذا تفعل الآن إذا بلع طفلك مادة خطرة؟ خمس أسئلة وتعرف القرار الصحيح.">
<title>اطمئن</title>
<link rel="icon" href="logo.svg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,400,0&display=block">
<style>
:root{--ink:#0D2B33;--ink2:#4A6168;--ink3:#7F9599;--brand:#1290B2;--deep:#0B5E75;--aqua:#88CCD2;--mist:#E6F4F5;--paper:#F6F3EE;--card:#fff;--line:#E3DED5;--red:#E2483D;--redS:#FCE9E7;--amber:#C98316;--amberS:#FDF2DF;--orange:#D9692E;--orangeS:#FBEADF;--green:#2F8A5F;--greenS:#E5F3EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink)}
button,input,select{font:inherit;color:inherit}
p{margin:0}
.i{font-family:"Material Symbols Rounded";font-size:22px;line-height:1;width:1em;height:1em;overflow:hidden;display:inline-block;direction:ltr;font-feature-settings:"liga";flex:none}
.shell{display:flex;flex-direction:column;height:100%}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 32px max(18px,env(safe-area-inset-right))}
.top{display:flex;align-items:center;gap:10px;padding:14px 0;min-height:64px}
.top h1{font-size:19px;margin:0;flex:1}
.ib{background:none;border:0;padding:8px;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--mist)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.tap{cursor:pointer;transition:border-color .15s,transform .15s}.tap:hover{border-color:var(--aqua)}
.label{font-size:13px;font-weight:600;color:var(--ink2);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{min-height:54px;border-radius:16px;border:0;background:var(--ink);color:#fff;font-weight:600;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 18px;text-decoration:none}
.btn:disabled{opacity:.35;cursor:default}
.btn.red{background:var(--red)}
.obtn{min-height:50px;border-radius:16px;border:1.4px solid var(--line);background:var(--card);font-weight:600;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 16px;text-decoration:none;color:inherit}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14.5px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.tag:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.critical{color:var(--red);background:var(--redS)}.high{color:var(--orange);background:var(--orangeS)}.moderate{color:var(--amber);background:var(--amberS)}.low{color:var(--green);background:var(--greenS)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2);margin-bottom:12px}
.input{height:54px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px;font-size:16px;outline:none;width:100%}
.input:focus,.searchbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,144,178,.12)}
.searchbox{display:flex;align-items:center;gap:10px;height:58px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:0 16px}
.searchbox input{border:0;outline:0;flex:1;background:none;font-size:17px;min-width:0}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border:1.4px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;text-align:right;width:100%;margin-bottom:10px}
.opt:hover{border-color:var(--aqua)}.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .ico{width:42px;height:42px;border-radius:12px;background:var(--mist);display:grid;place-items:center;color:var(--deep);flex:none}
.opt b{display:block;font-size:15.5px}.opt small{color:var(--ink2);font-size:13px}
.progress{display:flex;gap:6px;margin:4px 0 22px}.progress span{flex:1;height:5px;border-radius:3px;background:var(--line)}.progress span.on{background:var(--brand)}
.q{font-size:24px;line-height:1.35;margin:0 0 6px;font-weight:700;text-wrap:balance}
.qsub{color:var(--ink2);margin-bottom:20px;line-height:1.6}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:14px;margin-bottom:10px;align-items:flex-start;cursor:pointer}
.step .n{width:36px;height:36px;border-radius:11px;background:var(--mist);color:var(--deep);display:grid;place-items:center;flex:none}
.step p{font-size:15.5px;line-height:1.6}
.step.active{border:1.6px solid var(--brand)}.step.active.warn{border-color:var(--red)}
.step.active .n{background:var(--brand);color:#fff}.step.active.warn .n{background:var(--red)}
.step.done{background:rgba(230,244,245,.6)}.step.done .n{background:var(--green);color:#fff}.step.done p{color:var(--ink2)}
.verdict{border-radius:24px;padding:22px;color:#fff;display:flex;flex-direction:column;gap:10px}
.verdict .kicker{font-size:13px;font-weight:600;opacity:.85;letter-spacing:.2px}
.verdict h2{margin:0;font-size:26px;line-height:1.3}
.verdict p{opacity:.9;line-height:1.6}
.v-er{background:var(--red)}.v-call{background:var(--orange)}.v-consult{background:var(--deep)}.v-home{background:var(--green)}
.timer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;letter-spacing:1px}
.sheet{position:fixed;inset:0;background:rgba(13,43,51,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--paper);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:88%;overflow:auto}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:40;max-width:90vw}
.offline{background:var(--ink);color:#fff;font-size:13px;padding:8px 18px;display:flex;gap:8px;align-items:center}
.foot{position:sticky;bottom:0;padding:12px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%);display:flex;gap:12px}
.splash{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:50}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.hero{background:var(--ink);border-radius:26px;padding:24px;color:#fff;cursor:pointer;position:relative;overflow:hidden}
.hero .mark{position:absolute;inset-inline-start:-40px;bottom:-60px;width:220px;opacity:.08}
.nav{display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;padding:0 6px}
.nav .i{padding:4px 18px;border-radius:16px;font-size:24px}
.nav .on{color:var(--ink)}.nav .on .i{background:var(--mist)}
.side{display:none}
.cols{display:block}
.aside-sticky{display:block}
.brandrow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}

/* laptop / desktop */
@media (min-width:900px){
  .shell{flex-direction:row}
  .nav{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:250px;flex:none;border-inline-start:1px solid var(--line);padding:26px 16px;background:var(--paper)}
  .side .brandrow{padding:0 10px 26px}
  .side button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:0;background:none;font-size:15px;font-weight:500;color:var(--ink2);cursor:pointer;text-align:right}
  .side button:hover{background:var(--mist);color:var(--ink)}
  .side button.on{background:var(--ink);color:#fff}
  .side .sos{margin-top:auto;background:var(--red);color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:0;text-align:right}
  .wrap{padding-top:18px;padding-inline:40px}
  .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
  .aside-sticky{position:sticky;top:18px}
  .q{font-size:30px}
  .hero{padding:34px}
  .hero h2{font-size:34px!important}
  .verdict h2{font-size:30px}
  .narrow{max-width:640px}
  .toast{bottom:32px}
  .sheet{align-items:center}.sheet>div{border-radius:24px}
}
</style>
</head>
<body>
<div class="shell" id="shell"></div>
<script>
const LOGO='<svg viewBox="0 0 120 120" fill="none"><path d="M46 52H24a12 12 0 0 0 0 24h22v22a12 12 0 0 0 24 0V76" stroke="#88CCD2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 52V26a12 12 0 0 1 24 0v26h22a12 12 0 0 1 0 24H70" stroke="#1290B2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 34c0 14 8 22 18 22s16-6 20 2 8 14 16 14" stroke="#0B5E75" stroke-width="3.2" stroke-linecap="round"/><circle cx="30" cy="31" r="4" fill="#0B5E75"/><circle cx="88" cy="72" r="5.5" fill="#fff" stroke="#0B5E75" stroke-width="3.2"/></svg>';
const logo=n=>`<span style="display:inline-block;width:${n}px;height:${n}px;flex:none">${LOGO}</span>`;
const ic=(n,s='')=>`<span class="i" style="${s}">${n}</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const SEV={critical:'خطيرة جداً',high:'خطيرة',moderate:'متوسطة',low:'بسيطة'};
const tag=s=>`<span class="tag ${s}">${SEV[s]||s}</span>`;
const ORDER=['low','moderate','high','critical'];
const ICON={phone:'call',hospital:'local_hospital',water:'water_drop',cup:'local_drink',shower:'shower',eye:'visibility',lungs:'air',sit:'event_seat','no-food':'no_food',package:'inventory_2',hand:'back_hand',count:'format_list_numbered',clock:'schedule',chat:'forum',camera:'photo_camera',wind:'air',recovery:'airline_seat_flat',honey:'hive',info:'info'};
const SYM={vomiting:['قيء',1],cough:['سعال أو اختناق',2],drooling:['سيلان لعاب أو صعوبة بلع',2],mouth_burn:['ألم أو احمرار في الفم',2],drowsy:['نعاس شديد أو خمول',2],breathing:['صعوبة في التنفس',3],seizure:['تشنجات',3],unconscious:['فاقد الوعي أو صعب إيقاظه',3]};
const AMOUNT={taste:['لعق أو تذوق فقط','قطرات أو لمسة على اللسان','water_drop',0],sip:['رشفة أو حبة واحدة','كمية صغيرة واضحة','local_drink',1],more:['أكثر من رشفة أو أكثر من حبة','عدة رشفات أو حبات','science',2],unknown:['لا أعرف','العبوة مفتوحة ولا أعرف كم نقص','help',2]};
const WHEN={now:['الآن، أقل من 15 دقيقة',0],hour:['خلال الساعة الماضية',1],hours:['من 1 إلى 6 ساعات',2],long:['أكثر من 6 ساعات',3]};
const CATS={ingestion:['البلع والتسمم','science'],prevention:['الوقاية','shield'],choking:['الاختناق','air'],burns:['الحروق','local_fire_department'],bleeding:['النزيف','healing'],general:['عام','favorite']};
const HOSP=[["مستشفى الملك فهد المركزي بجازان",16.8892,42.5511],["مستشفى جازان العام",16.8995,42.566],["مستشفى الأمير محمد بن ناصر",16.9381,42.6138],["مستشفى صبيا العام",17.1522,42.6262],["مستشفى أبو عريش العام",16.9705,42.8322],["مدينة الملك فهد الطبية",24.689,46.7056],["مدينة الملك سعود الطبية",24.6234,46.7046],["مستشفى الملك خالد الجامعي",24.7175,46.622],["مستشفى الملك فيصل التخصصي",24.6714,46.6762],["مستشفى الولادة والأطفال بالرياض",24.7419,46.8026]];
const HONEY=["إذا عمره أكثر من سنة ومضى أقل من 12 ساعة: أعطه ملعقتين صغيرتين (10 مل) من العسل كل 10 دقائق في الطريق للمستشفى، بحد أقصى 6 مرات. لا تؤخر الذهاب للمستشفى لأجل ذلك","honey"];

let B=null;
const store={get(k,d){try{return JSON.parse(localStorage.getItem('atmaen.'+k))??d}catch{return d}},set(k,v){try{localStorage.setItem('atmaen.'+k,JSON.stringify(v))}catch{}}};
const S={tab:'home',stack:[],kids:store.get('kids',[]),cases:store.get('cases',[]),user:store.get('user',null)};
const shell=document.getElementById('shell');
const desktop=()=>matchMedia('(min-width:900px)').matches;

function ageMonths(b){const d=new Date(b),n=new Date();let m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())m--;return Math.max(0,m)}
function ageText(m){const y=Math.floor(m/12);if(m<12)return m+' شهر';if(y==1)return'سنة';if(y==2)return'سنتين';return y<=10?y+' سنوات':y+' سنة'}

// ---------- substance matching (same rules as the app's offline store) ----------
function norm(s){let t=String(s).toLowerCase().trim().replace(/[ً-ٰٟـ]/g,'');const m={'أ':'ا','إ':'ا','آ':'ا','ى':'ي','ة':'ه','ؤ':'و','ئ':'ي'};t=t.replace(/[أإآىةؤئ]/g,c=>m[c]).replace(/[^\w\s؀-ۿ]/g,' ');return t.split(/\s+/).map(w=>w.startsWith('ال')&&w.length>4?w.slice(2):w).join(' ')}
function sim(a,b){const m=a.length,n=b.length;if(!m||!n)return 0;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return 1-p[n]/Math.max(m,n)}
function rank(q){q=norm(q);if(q.length<2)return[];return B.chemicals.map(c=>{let best=0;for(const nm of [c.name_ar,c.name_en,...c.aliases.split(',')]){const n=norm(nm);if(!n)continue;const s=n===q?1:(n.startsWith(q)||n.includes(q))?.9:(q.includes(n)&&n.length>2)?.85:sim(q,n);if(s>best)best=s}return[c,best]}).sort((a,b)=>b[1]-a[1])}
function byBarcode(code){const d=String(code).replace(/\D/g,'');const p=B.products.find(x=>x.barcode===d||x.barcode==='0'+d);return p?B.chemicals.find(c=>c.id===p.chemical_id):null}

// ---------- triage: substance + amount + age + time + symptoms -> one decision ----------
function triage(t){
  const chem=t.chemId!=null?B.chemicals.find(c=>c.id===t.chemId):null;
  const cat=chem?chem.category:'unknown',p=B.protocols[cat]||B.protocols.unknown;
  let sev=p.severity;if(chem&&ORDER.indexOf(chem.hazard_level)>ORDER.indexOf(sev))sev=chem.hazard_level;
  const symW=Math.max(0,...t.sym.map(s=>SYM[s][1])),amt=AMOUNT[t.amount][3],ageM=t.ageM;
  let v,why;
  if(symW>=3){v='er';sev='critical';why='ظهرت عليه علامة خطر'}
  else if(ageM!=null&&ageM<6){v='call';why='الرضع أقل من 6 أشهر يحتاجون تقييماً طبياً مباشراً'}
  else if(sev==='critical'){v='er';why=cat==='button_battery'||cat==='magnet'?'هذه المادة تسبب ضرراً داخلياً حتى بدون أعراض':'هذه المادة شديدة السمية للأطفال'}
  else if(symW==2){v=sev==='low'?'call':'er';why='تظهر عليه أعراض واضحة'}
  else if(!chem){v='call';why='لم نتعرف على المادة، نحتاج رأي مختص'}
  else if(sev==='high'){v=amt>=2?'er':'call';why=amt>=2?'مادة خطرة وكمية غير قليلة':'مادة خطرة حتى بكمية صغيرة'}
  else if(sev==='moderate'){v=amt>=2||(ageM!=null&&ageM<24&&amt>=1)?'call':'home';why=v==='call'?'الكمية بالنسبة لعمره تحتاج استشارة':'كمية صغيرة من مادة متوسطة'}
  else{v=symW>=1&&amt>=2?'call':'home';why='مادة منخفضة السمية'}
  if(v==='home'&&t.when==='long'&&symW>=1)v='call';
  if(symW>=1&&sev==='low'&&v==='home')sev='moderate';
  if(v==='er'&&sev!=='critical')sev=ORDER.indexOf(sev)<2?'high':sev;

  const icons=new Set(p.steps.map(s=>s.icon));
  let steps=[...B.first_steps.map((x,i)=>[x,i?'package':'hand']).filter(s=>!icons.has(s[1])),...p.steps.map(s=>[s.text,s.icon])];
  if(cat==='button_battery'&&ageM!=null&&ageM>=12&&!/عسل|honey/i.test(t.allergies||''))steps.splice(2,0,HONEY);
  if(v==='er')steps.unshift(['اتصل بالإسعاف 997 الآن وشغّل مكبر الصوت وتابع الخطوات','phone']);
  if(v==='home')steps=steps.filter(s=>s[1]!=='phone'&&s[1]!=='hospital');
  const head=chem?chem.name_ar:(t.q||'مادة غير معروفة');
  return{chem,cat,sev,v,why,head,headline:p.headline,steps,doNot:[...B.universal_do_not,...p.do_not],
    watch:[...new Set([...p.watch_for,...B.red_flags.slice(0,3)])],observe:v==='home'?(cat==='hydrocarbon'?360:60):0}
}
const VERDICT={
  er:['اتصل بالإسعاف 997 الآن','v-er','emergency','اذهب للطوارئ أو اتصل 997 فوراً، وتابع الخطوات حتى وصول المساعدة.'],
  call:['اتصل الآن بمختص قبل أي شيء','v-call','call','اتصل بالاستشارات الطبية 937 ومعك العبوة ووزن الطفل. وإذا ساءت حالته اتصل 997.'],
  home:['يمكنك متابعته في المنزل','v-home','home_health','الخطورة منخفضة. اتبع الخطوات وراقبه، ويوجد مؤقت للمراقبة بالأسفل.'],
};

function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function call(n){location.href='tel:'+n}
function push(v,data){S.stack.push({v,data});render(true)}
function back(){try{speechSynthesis.cancel()}catch{}S.speaking=false;S.stack.pop();render(true)}
function go(tab){S.tab=tab;S.stack=[];render(true)}

const TABS=[['home','home','الرئيسية'],['kids','child_care','أطفالي'],['lib','menu_book','المكتبة'],['history','history','السجل']];
const nav=()=>`<div class="nav">${TABS.map(([k,i,l])=>`<button class="${S.tab==k&&!S.stack.length?'on':''}" onclick="go('${k}')">${ic(i)}<span>${l}</span></button>`).join('')}</div>`;
const side=()=>`<aside class="side"><div class="brandrow">${logo(34)}اطمئن</div>${TABS.map(([k,i,l])=>`<button class="${S.tab==k&&!S.stack.length?'on':''}" onclick="go('${k}')">${ic(i)}${l}</button>`).join('')}
<button class="sos" onclick="startTriage()"><b style="font-size:17px;display:flex;gap:8px;align-items:center">${ic('emergency')}عندي حالة الآن</b><span style="font-size:13px;opacity:.85">ابدأ التقييم خلال ثوانٍ</span></button>
<p style="font-size:12px;color:var(--ink3);padding:14px 10px 0;line-height:1.6">في الحالات الحرجة اتصل 997 مباشرة</p></aside>`;
const topbar=(t,extra='')=>`<div class="top"><button class="ib" onclick="back()" aria-label="رجوع">${ic('arrow_forward')}</button><h1>${t}</h1>${extra}</div>`;

function prog(n){return`<div class="progress">${[1,2,3,4,5].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>`}
function wizard(n,q,sub,key,opts){const t=S.t;return`<div class="wrap narrow">${topbar('')}${prog(n)}<p class="q">${q}</p><p class="qsub">${sub}</p>
${opts.map(([k,a,b,i])=>`<button class="opt ${t[key]===k?'on':''}" onclick="S.t.${key}='${k}';push('t${n+1}')"><span class="ico">${ic(i)}</span><span style="flex:1"><b>${a}</b>${b?`<small>${b}</small>`:''}</span>${ic('chevron_left','color:var(--ink3)')}</button>`).join('')}</div>`}
function sug(){const t=S.t;if(t.chemId!=null||t.q.trim().length<2)return'';const r=rank(t.q).filter(x=>x[1]>=.6).slice(0,4);if(!r.length)return`<p style="color:var(--ink2);font-size:14px;margin-top:10px">لا نجد هذا الاسم. اضغط التالي وسنكمل بخطوات آمنة عامة.</p>`;
  return`<div class="panel" style="padding:4px 0;margin-top:8px">${r.map(([c])=>`<div class="tap" onclick="S.t.chemId=${c.id};S.t.q='${esc(c.name_ar)}';next1()" style="display:flex;align-items:center;padding:10px 16px;gap:10px"><div style="flex:1"><div style="font-weight:600">${esc(c.name_ar)}</div><div dir="ltr" style="font-size:12px;color:var(--ink2);text-align:right">${esc(c.name_en)}</div></div>${tag(c.hazard_level)}</div>`).join('')}</div>`}
function keep(id){const el=document.getElementById('sug');if(el)el.innerHTML=sug();const b=document.querySelector('.foot .btn');if(b)b.disabled=S.t.q.trim().length<2&&S.t.chemId==null}
function startTriage(){S.t={q:'',chemId:null,amount:null,kid:null,ageM:null,when:null,sym:[],noSym:false,allergies:''};if(S.kids.length===1)pickKid(0,true);S.cur=0;S.timerEnd=null;push('t1');setTimeout(()=>document.getElementById('q')?.focus(),50)}
function next1(unknown){const t=S.t;if(!unknown&&t.chemId==null){const r=rank(t.q)[0];if(r&&r[1]>=.75)t.chemId=r[0].id}push('t2')}
function pickKid(i,silent){const k=S.kids[i];S.t.kid=i;S.t.ageM=ageMonths(k.birth);S.t.allergies=k.allergies||'';if(!silent)render()}
function togSym(k){const s=S.t.sym,i=s.indexOf(k);i<0?s.push(k):s.splice(i,1);S.t.noSym=false;render()}
function finish(){const t=S.t,r=triage(t);S.cases.unshift({...t,name:r.head,kidName:t.kid!=null?S.kids[t.kid]?.name:null,sev:r.sev,v:r.v,at:Date.now()});S.cases=S.cases.slice(0,50);store.set('cases',S.cases);
  S.stack=[];S.cur=0;S.timerEnd=null;push('result');if(r.v==='er')setTimeout(speak,500)}
function reopen(i){S.t={...S.cases[i]};S.cur=0;S.timerEnd=null;S.stack=[];push('result')}
function fmt(t){return new Date(t).toLocaleString('ar-SA-u-nu-latn-ca-gregory',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function mmss(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function timerLeft(){return S.timerEnd?(S.timerEnd-Date.now())/1000:(S.r?.observe||0)*60}
function startTimer(min){S.timerEnd=Date.now()+min*60000;render();toast('بدأت المراقبة')}
setInterval(()=>{const el=document.getElementById('tm');if(el&&S.timerEnd){const l=timerLeft();el.textContent=mmss(l);if(l<=0){S.timerEnd=null;toast('انتهت مدة المراقبة. إذا كان طبيعياً فالحمد لله على سلامته');render()}}},1000);
let delArmed=0;function sure(m){if(Date.now()-delArmed<3000)return true;delArmed=Date.now();toast(m+'، اضغط مرة أخرى للتأكيد');return false}
function delKid(i){if(sure('سيُحذف '+S.kids[i].name)){S.kids.splice(i,1);store.set('kids',S.kids);back()}}
function logout(){if(sure('سيتم حذف بياناتك من هذا الجهاز')){['user','kids','cases'].forEach(k=>localStorage.removeItem('atmaen.'+k));location.reload()}}
function saveKid(i){const g=id=>document.getElementById(id).value.trim();const k={name:g('kn'),birth:g('kb'),weight:parseFloat(g('kw').replace('٫','.'))||null,height:parseFloat(g('kh'))||null,allergies:g('ka')||null};
  if(!k.name)return toast('اكتب اسم الطفل');if(!k.birth)return toast('اختر تاريخ الميلاد');if(k.weight&&(k.weight<1||k.weight>150))return toast('الوزن غير صحيح');if(i==null)S.kids.push(k);else S.kids[i]=k;store.set('kids',S.kids);back();toast('تم الحفظ')}
async function scan(){if(!('BarcodeDetector'in window)){const sh=sheet(`<h2 style="font-size:19px;margin:0 0 6px">رقم الباركود</h2><p style="color:var(--ink2);font-size:14px;margin-bottom:14px">اكتب الأرقام الموجودة تحت الخطوط على العبوة.</p><input class="input" id="bc" inputmode="numeric" dir="ltr"><div class="grid2" style="margin-top:12px"><button class="btn" id="bcok">بحث</button><button class="obtn" onclick="this.closest('.sheet').remove()">إلغاء</button></div>`);
  sh.querySelector('#bcok').onclick=()=>{const c=sh.querySelector('#bc').value;sh.remove();useBarcode(c)};return}
  try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const sh=sheet(`<video playsinline autoplay muted style="width:100%;border-radius:16px;background:#000"></video><p style="margin:12px 0;text-align:center">وجّه الكاميرا للباركود</p><button class="obtn">إلغاء</button>`);const v=sh.querySelector('video');v.srcObject=stream;const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','qr_code']});let stop=false;const end=()=>{stop=true;stream.getTracks().forEach(t=>t.stop());sh.remove()};sh.querySelector('button').onclick=end;
  const loop=async()=>{if(stop)return;try{const r=await det.detect(v);if(r[0]){end();useBarcode(r[0].rawValue);return}}catch{}requestAnimationFrame(loop)};v.onloadeddata=loop}catch{toast('لا يمكن فتح الكاميرا، اكتب اسم المادة')}}
function useBarcode(c){const chem=byBarcode(c);if(!chem){toast('المنتج غير موجود في القاعدة، اكتب اسمه');return}S.t.chemId=chem.id;S.t.q=chem.name_ar;toast('تم التعرف: '+chem.name_ar);push('t2')}
function sheet(html){const sh=document.createElement('div');sh.className='sheet';sh.onclick=e=>{if(e.target===sh)sh.remove()};sh.innerHTML=`<div>${html}</div>`;document.body.appendChild(sh);return sh}
function speak(){if(!('speechSynthesis'in window))return toast('القراءة الصوتية غير مدعومة في هذا المتصفح');if(S.speaking){speechSynthesis.cancel();S.speaking=false;render();return}const r=S.r,ord=['أولاً','ثانياً','ثالثاً','رابعاً','خامساً','سادساً','سابعاً','ثامناً'];
  const u=new SpeechSynthesisUtterance(VERDICT[r.v][0]+'. '+r.steps.map((s,i)=>(ord[i]||'')+'، '+s[0]).join('. '));u.lang='ar-SA';u.rate=.9;u.onend=()=>{S.speaking=false;render()};speechSynthesis.speak(u);S.speaking=true;render()}
function hav(a,b,c,d){const r=x=>x*Math.PI/180;const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function hospitals(){const sh=sheet(`<h2 style="font-size:19px;margin:0 0 14px">الطوارئ القريبة منك</h2><div id="hl"><p style="color:var(--ink2)">نحدد موقعك...</p></div><div class="grid2" style="margin-top:12px"><button class="btn red" onclick="call('997')">${ic('call')}997</button><button class="obtn" onclick="this.closest('.sheet').remove()">إغلاق</button></div>`),list=sh.querySelector('#hl');
  if(!navigator.geolocation){list.innerHTML='<p>تحديد الموقع غير مدعوم.</p>';return}
  navigator.geolocation.getCurrentPosition(p=>{const{latitude:a,longitude:b}=p.coords;S.pos=[a,b];const r=HOSP.map(h=>[h,hav(a,b,h[1],h[2])]).sort((x,y)=>x[1]-y[1]).slice(0,3);
    list.innerHTML=r.map(([h,d])=>`<a class="panel" href="https://www.google.com/maps/dir/?api=1&destination=${h[1]},${h[2]}" target="_blank" rel="noopener" style="display:flex;gap:12px;align-items:center;margin-bottom:8px;text-decoration:none;color:inherit">${ic('local_hospital','color:var(--deep)')}<b style="flex:1;font-weight:600">${h[0]}</b><span style="color:var(--ink2)">${d.toFixed(1)} كم</span>${ic('directions','color:var(--brand)')}</a>`).join('')+`<a class="obtn" href="sms:?&body=${encodeURIComponent('حالة طوارئ، موقعي: https://maps.google.com/?q='+a.toFixed(5)+','+b.toFixed(5))}">${ic('share_location')}أرسل موقعي برسالة</a>`},
  ()=>{list.innerHTML='<p style="color:var(--ink2);line-height:1.6">لم نتمكن من تحديد موقعك. فعّل خدمة الموقع أو اتصل 997.</p>'},{enableHighAccuracy:true,timeout:8000})}
async function share(){const t=S.t,r=S.r,kid=t.kid!=null?S.kids[t.kid]:null;
  const txt=`حالة بلع مادة\nالمادة: ${r.head}\nالكمية: ${AMOUNT[t.amount][0]}\nالطفل: ${kid?kid.name+'، ':''}${ageText(t.ageM)}${kid&&kid.weight?'، '+kid.weight+' كجم':''}${kid&&kid.allergies?'، حساسية: '+kid.allergies:''}\nالوقت: ${WHEN[t.when][0]}\nالأعراض: ${t.sym.length?t.sym.map(s=>SYM[s][0]).join('، '):'لا توجد'}\nالتقييم: ${VERDICT[r.v][0]}`;
  try{if(navigator.share)await navigator.share({text:txt});else{await navigator.clipboard.writeText(txt);toast('تم نسخ ملخص الحالة، الصقه للطبيب أو الإسعاف')}}catch{}}

let lastKey='';
function render(nav_){const t=S.stack[S.stack.length-1];const key=t?t.v:(S.user?S.tab:'welcome');
  let body;if(!S.user&&!t)body=V.welcome();else body=t?V[t.v](t.data):V[S.tab]();
  const main=shell.querySelector('.main'),sc=main&&!nav_&&key===lastKey?main.scrollTop:0;
  const chrome=S.user&&!(t&&/^t\d|signup/.test(t.v));
  shell.innerHTML=(chrome?side():'')+`<div style="flex:1;display:flex;flex-direction:column;min-width:0;height:100%"><main class="main">${body}</main>${chrome?nav():''}</div>`;
  shell.querySelector('.main').scrollTop=sc;lastKey=key}
addEventListener('online',()=>render());addEventListener('offline',()=>render());
let wasDesk=desktop();addEventListener('resize',()=>{if(desktop()!==wasDesk){wasDesk=desktop();render()}});
history.pushState(0,'');addEventListener('popstate',()=>{if(S.stack.length)back();history.pushState(0,'')});

shell.innerHTML=`<div class="splash">${logo(110)}<p style="text-align:center;font-size:19px;line-height:1.7;font-weight:600;color:var(--brand)">اطمئن... وصلت إلى وجهتك الأولى<br>للإسعافات الأولية</p></div>`;
(async()=>{const cached=store.get('bundle',null);
  try{const r=await fetch('https://raw.githubusercontent.com/FF-019/atmaen/main/mobile/assets/offline/bundle.json',{cache:'no-cache'});if(r.ok){B=await r.json();store.set('bundle',B)}}catch{}
  if(!B)B=cached;
  setTimeout(()=>{if(!B){shell.innerHTML='<div style="padding:40px;text-align:center;line-height:1.8">تحتاج اتصالاً بالإنترنت لأول تشغيل فقط.<br>في الحالات الطارئة اتصل 997</div>';return}render(true)},900)})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
